  externalLindorm:
    # LindormサービスURL
    url: "http://localhost:30070"
    username: "admin"
    password: "admin"
    indexType: "hnsw"
    distanceType: "l2"
    usingUgc: true
    queryTimeout: 2.0

qdrant:
  # 内蔵 Qdrant ベクトルデータベースを有効にするかどうか
  enabled: false
  # Qdrant レプリカ数
  replicaCount: 3
  image:
    repository: langgenius/qdrant
    pullPolicy: IfNotPresent
    tag: "v1.7.3"
  # Qdrant API キー
  apiKey: "dify123456"
  persistence:
    # ストレージアクセスモード
