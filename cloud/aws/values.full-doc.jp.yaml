  externalElasticsearch:
    # Elasticsearch ホストアドレス
    host: "127.0.0.1"
    # Elasticsearch ポート
    port: 9200
    # ユーザー名
    username: "elastic"
    # パスワード
    password: "#REPLACE_ME#"
  externalAnalyticDB:
    # アリババクラウド AnalyticDB キー ID
    keyID: "#REPLACE_ME#"
    # キーシークレット
    keySecret: "#REPLACE_ME#"
    # リージョン ID
    regionID: "#REPLACE_ME#"
    # インスタンス ID
    instanceID: "#REPLACE_ME#"
    # アカウント名
    account: "#REPLACE_ME#"
    # パスワード
    password: "#REPLACE_ME#"
    # ホストアドレス
    host: "#REPLACE_ME#"
    # ポート
    port: 5432
    # ネームスペース
    namespace: ""
    # ネームスペースパスワード
    namespacePassword: ""
    # 最小接続数
    minConnection: 1
    # 最大接続数
