    # Milvus データベース名
    database: "default"
  externalRelyt:
    # Relyt データベースホストアドレス
    host: "your-relyt.domain"
    # Relyt ポート
    port: 5431
    # ユーザー名
    user: "postgres"
    # パスワード
    password: "#REPLACE_ME#"
    # データベース名
    database: "pgvectors"
  externalPgVectoRS:
    # PgVecto-RS データベースホスト
    host: "your-pgvectors.domain"
    # ポート
    port: 5432
    # ユーザー名
    user: "postgres"
    # パスワード
    password: "#REPLACE_ME#"
    # データベース名
    database: "pgvectors"
  externalTencentVectorDB:
    # テンセントベクトルデータベースホスト
    host: "your-tencent-vector-db.domain"
    # API キー
    apiKey: "#REPLACE_ME#"
    # 接続タイムアウト
