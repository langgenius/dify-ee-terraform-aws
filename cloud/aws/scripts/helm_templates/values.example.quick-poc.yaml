###################################
# {{local_domain}} is the domain name for dify access. Default is .local
# {{secret_key}} is the secret key for dify access.  Use openssl rand -base64 42 to generate a random string
# {{region}} is the region for aws access. E.g. us-east-2
# {{account_id}} is the account id for aws access. E.g. 1234567890
# {{deployment_id}} is the unique deployment identifier. E.g. dev1, prod1, staging
# {{cert_uuid}} is the uuid for aws access. E.g. 12345678-1234-1234-1234-123456789012


# {{s3_bucket_name}} is the bucket name for s3 access. E.g. dify-test-storage-t5ap12345

# {{rds_address}} is the address for rds access. Default is dify-eks-cluster-aurora-postgres.cluster-12345678.us-east-2.rds.amazonaws.com
# {{rds_password}} is the password for rds access. Default is DifyRdsPassword123!

# {{rds_main_database_name}} is the main database name. Default is dify
# {{rds_enterprise_database_name}} is the enterprise database name. Default is enterprise
# {{rds_audit_database_name}} is the audit database name. Default is audit 
# {{rds_plugin_daemon_database_name}} is the plugin daemon database name Default is dify_plugin_daemon
#
#
# {{redis_address}} is the address for redis access. Default is dify-eks-cluster-redis.xxxxxxx.ng.0001.use2.cache.amazonaws.com


# {{opensearch_address}} is the address for opensearch access. E.g. vpc-dify-eks-cluster-opensearch-12345678.us-east-2.es.amazonaws.com
# {{opensearch_user}} is the user for opensearch access. E.g. admin
# {{opensearch_password}} is the password for opensearch access. E.g. DifyOpenSearchPass123!
###################################
# Note: Approximate 17G Disk Space will be used, please make sure you have enough space in nodes.
#       Each unstructured replica will use approx. 8.4G Disk Space.
###################################
# Profile: quick-poc (HPA off — set enable_hpa = false in terraform.tfvars)
# - All deployments use static replicas = 1 for minimal footprint.
# - No resources.requests are set, so HPA CANNOT work with this profile
#   (HPA needs CPU/memory requests to compute utilization; targets stay
#   <unknown>). Use the test or prod profile to exercise HPA.
###################################
global:
  appSecretKey: '{{secret_key}}'
  consoleApiDomain: "console.{{local_domain}}"
  consoleWebDomain: "console.{{local_domain}}"
  serviceApiDomain: "api.{{local_domain}}"
  appApiDomain: "app.{{local_domain}}"
  appWebDomain: "app.{{local_domain}}"
  filesDomain: "upload.{{local_domain}}"
  enterpriseDomain: "enterprise.{{local_domain}}"
  triggerDomain: "trigger.{{local_domain}}"
  innerApiKey: {{secret_key}} #added in 3.5.0
  useTLS: {{isUseTLS}}

ingress:
  enabled: true
  className: "alb"  # Use AWS ALB Ingress Controller
  annotations: {
    kubernetes.io/ingress.class: alb,
    alb.ingress.kubernetes.io/scheme: {{elb_mode}},
    alb.ingress.kubernetes.io/target-type: ip,
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]',
    alb.ingress.kubernetes.io/ssl-redirect: '443',
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:{{region}}:{{account_id}}:certificate/{{cert_uuid}}', # using AWS ACM certificate
  }

api:
  replicas: 1
  serverWorkerAmount: 1
  serviceAccountName: "dify-api-sa"
  innerApi:
    apiKey: "{{secret_key}}"


worker:
  replicas: 1
  celeryWorkerAmount: 1
  serviceAccountName: "dify-api-sa"
# Override chart default additionalWorkers list to disable the built-in
# trigger-worker. The main `worker` above already consumes every Celery queue
# (including the trigger queues: schedule_poller, schedule_executor,
# triggered_workflow_dispatcher, trigger_refresh_executor), and the chart's
# trigger-worker has no IRSA service-account binding so it crash-loops on
# any S3 call (NoCredentialsError). Setting the list explicitly replaces
# the chart default — to split queues onto dedicated pods, append entries:
#   - name: workflow-worker
#     enabled: true
#     replicas: 1
#     celeryQueues: "workflow,workflow_storage,workflow_based_app_execution"
#     celeryWorkerAmount: 2
#
# Still required at chart 3.12.0: the chart default continues to ship
# trigger-worker enabled with no IRSA service account.
additionalWorkers:
  - name: trigger-worker
    enabled: false
workerBeat:
  replicas: 1
  serviceAccountName: "dify-api-sa"


web:
  replicas: 1

sandbox:
  replicas: 1
  apiKey: "{{secret_key}}"

enterpriseAudit:
  replicas: 1

enterprise:
  replicas: 1
  appSecretKey: "{{secret_key}}"
  adminAPIsSecretKeySalt: "{{secret_key}}"
  # 32-byte AES-256 key for password policy encryption (new in 3.9.x).
  # Chart ships a public default; override even in quick-poc. Generated by
  # scripts/4_generate_dify_helm.sh via `openssl rand -base64 32`.
  passwordEncryptionKey: "{{password_encryption_key}}"
  innerApi:
    apiKey: "{{secret_key}}"


enterpriseFrontend:
  replicas: 1
ssrfProxy:
  enabled: true
  replicas: 1
unstructured:
  enabled: true
  replicas: 1

  
plugin_daemon:
  replicas: 1
  apiKey: "{{secret_key}}"
  serviceAccountName: "dify-api-sa"

plugin_controller:
  replicas: 1
plugin_manager:
  replicas: 1
plugin_connector:
  replicas: 1
  apiKey: "{{secret_key}}"
  customServiceAccount: "dify-plugin-crd-sa"
  runnerServiceAccount: "dify-plugin-runner-sa"
  imageRepoPrefix: "{{account_id}}.dkr.ecr.{{region}}.{{awsservice_suffix}}/dify-{{deployment_id}}"
  imageRepoType: ecr
  ecrRegion: "{{region}}"
gateway:
  replicas: 1

# ── New in chart 3.10.x–3.12.x ─────────────────────────
# agent-backend (new in 3.12.0): backend for Dify Agent apps. Enabled by
# default in the chart. The chart ships a PUBLIC default serverSecretKey;
# always override it.
agentBackend:
  replicas: 1
  serverSecretKey: "{{agent_backend_secret_key}}"

# enterprise-rbac (new in 3.11.0): workspace RBAC gRPC service. Required.
enterpriseRbac:
  replicas: 1

# Kubernetes Agent Sandbox (new in 3.12.0). Keep disabled unless the
# kubernetes-sigs/agent-sandbox controller + CRDs are installed BEFORE the
# chart upgrade — otherwise helm fails creating SandboxTemplate/SandboxWarmPool.
sandboxGateway:
  enabled: false


###################################
# Persistent Storage Configuration
###################################
persistence:
  type: "s3"
  s3:
    endpoint: ""  # Leave empty for native AWS S3; the SDK resolves endpoint from region.
                  # Setting a URL here propagates to kaniko's S3_ENDPOINT env and breaks STS
                  # (kaniko treats it as a global AWS endpoint override -> AssumeRoleWithWebIdentity
                  # hits the S3 endpoint and returns HTTP 405). Only set for MinIO / non-AWS S3.
    accessKey: ""  # Use IRSA, no need to fill
    secretKey: ""  # Use IRSA, no need to fill
    region: "{{region}}"
    bucketName: "{{bucket_name}}"
    addressType: ""
    useAwsManagedIam: true 
    useAwsS3: true



###################################
# External Database Configuration (Dify chart 3.9.x–3.12.x schema)
###################################
externalDatabase:
  enabled: true
  engine: "postgres"
  host: "{{rds_address}}"
  port: 5432
  user: "postgres"
  password: "{{rds_password}}"
  databases:
    dify: "{{rds_main_database_name}}"
    plugin_daemon: "{{rds_plugin_daemon_database_name}}"
    enterprise: "{{rds_enterprise_database_name}}"
    audit: "{{rds_audit_database_name}}"
  dialectOptions:
    postgres:
      sslMode: "require"
      uriScheme: "postgresql"
      extras: ""

###################################
# External Redis Configuration
###################################
externalRedis:
  enabled: true
  host: "{{redis_address}}"
  port: 6379
  username: ""
  password: ""  # ElastiCache Redis doesn't require password by default
  useSSL: true

###################################
# External Vector Database Configuration
###################################
vectorDB:
  useExternal: true
  externalType: "opensearch"
  externalOpenSearch:
    host: "{{opensearch_address}}"
    port: 443
    user: "admin"
    password: "DifyOpenSearchPass123!"
    useTLS: true

imagePullSecrets: []
