###################################
# {{local_domain}} is the domain name for dify access. Default is .local
# {{secret_key}} is the secret key for dify access.  Use openssl rand -base64 42 to generate a random string
# {{region}} is the region for aws access. E.g. us-east-1
# {{account_id}} is the account id for aws access. E.g. 1234567890
# {{deployment_id}} is the unique deployment identifier. E.g. dev1, prod1, staging
# {{cert_uuid}} is the uuid for aws access. E.g. 12345678-1234-1234-1234-123456789012


# {{s3_endpoint}} is the endpoint for s3 access. E.g. https://xxx.r2.cloudflarestorage.com
# {{s3_bucket_name}} is the bucket name for s3 access. E.g. your-bucket-name
# {{s3_access_key}} is the access key for s3 access
# {{s3_secret_key}} is the secret key for s3 access

# {{postgres_address}} is the address for postgres access
# {{postgres_password}} is the password for postgres access

# {{rds_address}} is the address for rds access. Default is dify-eks-cluster-aurora-postgres.cluster-12345678.us-east-2.rds.amazonaws.com
# {{rds_password}} is the password for rds access. Default is DifyRdsPassword123!

# {{rds_main_database_name}} is the main database name. Default is dify
# {{rds_enterprise_database_name}} is the enterprise database name. Default is enterprise
# {{rds_audit_database_name}} is the audit database name. Default is audit 
# {{rds_plugin_daemon_database_name}} is the plugin daemon database name Default is dify_plugin_daemon
#
#
#
# {{redis_address}} is the address for redis access
# {{redis_password}} is the password for redis access


# {{qdrant_endpoint}} is the endpoint for qdrant access. E.g. http://your-qdrant-cluster-url.qdrant.tech/
# {{qdrant_api_key}} is the api key for qdrant access
###################################
# Note: Approximate 27G Disk Space will be used, please make sure you have enough space in nodes.
#       Each unstructured replica will use approx. 8.4G Disk Space.
###################################
global:
  appSecretKey: '{{secret_key}}'
  consoleApiDomain: "console.{{local_domain}}"
  consoleWebDomain: "console.{{local_domain}}"
  serviceApiDomain: "api.{{local_domain}}"
  appApiDomain: "app.{{local_domain}}"
  appWebDomain: "app.{{local_domain}}"
  filesDomain: "upload.{{local_domain}}"
  enterpriseDomain: "enterprise.{{local_domain}}"
  triggerDomain: "trigger.{{local_domain}}"
  innerApiKey: {{secret_key}} #added in 3.5.0
  useTLS: {{isUseTLS}}

ingress:
  enabled: true
  className: "alb"  # Use AWS ALB Ingress Controller
  annotations: {
    kubernetes.io/ingress.class: alb,
    alb.ingress.kubernetes.io/scheme: {{elb_mode}},
    alb.ingress.kubernetes.io/target-type: ip,
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]',
    alb.ingress.kubernetes.io/ssl-redirect: '443',
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:{{region}}:{{account_id}}:certificate/{{cert_uuid}}', # using AWS ACM certificate
  }

api:
  replicas: 3
  serverWorkerAmount: 1
  serviceAccountName: "dify-api-sa"
  innerApi:
    apiKey: "{{secret_key}}"
worker:
  replicas: 1
  serviceAccountName: "dify-api-sa"
triggerWorker:
  replicas: 1
  serviceAccountName: "dify-api-sa"
workerBeat:
  replicas: 1
  serviceAccountName: "dify-api-sa"
web:
  replicas: 1
sandbox:
  replicas: 1
  apiKey: "{{secret_key}}"
enterpriseAudit:
  replicas: 1
enterprise:
  replicas: 1
  appSecretKey: "{{secret_key}}"
  adminAPIsSecretKeySalt: "{{secret_key}}"
  innerApi:
    apiKey: "{{secret_key}}"
enterpriseFrontend:
  replicas: 1
ssrfProxy:
  enabled: true
  replicas: 1
unstructured:
  enabled: true
  replicas: 1
plugin_daemon:
  replicas: 1
  apiKey: "{{secret_key}}"
plugin_controller:
  replicas: 1
plugin_manager:
  replicas: 1
plugin_connector:
  replicas: 1
  apiKey: "{{secret_key}}"
  customServiceAccount: "dify-plugin-crd-sa"
  runnerServiceAccount: "dify-plugin-runner-sa"
  imageRepoPrefix: "{{account_id}}.dkr.ecr.{{region}}.{{awsservice_suffix}}/dify-{{deployment_id}}"
  imageRepoType: ecr
  ecrRegion: "{{region}}"
gateway:
  replicas: 1

###################################
# Persistence Configration
###################################
persistence:
  type: "s3"
  s3:
    endpoint: "{{s3_endpoint}}"
    accessKey: ""
    secretKey: ""
    region: "{{region}}"
    bucketName: "{{s3_bucket_name}}"
    addressType: ""
    useAwsManagedIam: true
    useAwsS3: true

###################################
# External postgres
###################################
externalPostgres:
  enabled: true
  address: "{{rds_address}}"
  port: 5432
  credentials:
    dify:
      database: "{{rds_main_database_name}}"
      username: "postgres"
      password: "{{rds_password}}"
      sslmode: "require"
    plugin_daemon:
      database: "{{rds_plugin_daemon_database_name}}"
      username: "postgres"
      password: "{{rds_password}}"
      sslmode: "require"
    enterprise:
      database: "{{rds_enterprise_database_name}}"
      username: "postgres"
      password: "{{rds_password}}"
      sslmode: "require"
    audit:
      database: "{{rds_audit_database_name}}"
      username: "postgres"
      password: "{{rds_password}}"
      sslmode: "require"

###################################
# External Redis
###################################
externalRedis:
  enabled: true
  host: "{{redis_address}}"
  port: 6379
  username: ""
  password: ""
  useSSL: false

###################################
# External Qdrant
###################################
vectorDB:
  useExternal: true
  externalType: "opensearch"
  externalOpenSearch:
    host: "{{opensearch_address}}"
    port: 443
    user: "{{opensearch_user}}"
    password: "{{opensearch_password}}"
    useTLS: true

imagePullSecrets: []