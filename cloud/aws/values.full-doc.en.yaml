# Default values for dify.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
  # Secret key for securely signing session cookies and encrypting sensitive information in the database. Generate a strong key using `openssl rand -base64 42`
  appSecretKey: "#REPLACE_ME#"
  # Secret key for inner API calls. Generate a strong key using `openssl rand -base64 42`
  innerApiKey: "#REPLACE_ME#"
  # Whether to enable TLS/HTTPS encrypted transmission for internal cluster URL protocol, true=enable HTTPS, false=use HTTP
  useTLS: false
  # Backend domain for console API, used for composing authorization callback URLs
  # If empty, uses the same domain. Example: console.dify.ai
  consoleApiDomain: ""
  # Frontend domain for console web, used for composing frontend addresses and CORS configuration
  # If empty, uses the same domain. Example: console.dify.ai
  consoleWebDomain: ""
  # Service API domain, used to display Service API Base URL to frontend
  # If empty, uses the same domain. Example: api.dify.ai
  serviceApiDomain: ""
  # WebApp API backend domain, used to declare backend URL for frontend API
  # If empty, uses the same domain. Example: app.dify.ai
  appApiDomain: ""
  # WebApp domain, used to display WebApp API Base URL to frontend. If empty, uses the same domain. Example: app.dify.ai
  appWebDomain: ""
  # File preview or download domain, used to display file preview
  # or download URLs to frontend or as multimodal model input;
  # To prevent forgery, image preview URLs are signed with 5-minute expiration
  filesDomain: ""
  # Enterprise service domain, used for enterprise edition frontend and backend API URLs
  enterpriseDomain: ""
  # Trigger service domain, used by API and workers for trigger functionality
  # If empty, trigger functionality may not work properly. Example: trigger.dify.ai
  triggerDomain: ""
  # When enabled, migrations will be executed before application startup, and the application will start after migration completion
  dbMigrationEnabled: true
  rag:
    # RAG ETL type, supports: dify or Unstructured
    etlType: "dify"
    # Keyword data source storage type, supports "database" for storing in database, "object_storage" for using object storage like MinIO/S3
    keywordDataSourceType: "object_storage"
    # Maximum top-k value for RAG
    topKMaxValue: 10
    # Document chunking length configuration. Used to control text segment size when processing long documents
    indexingMaxSegmentationTokensLength: 4000
  integrations:
    notion:
      # Notion import configuration, supports public and internal
      integrationType: "internal"
      # Client ID of Notion OAuth application, obtained from Notion developer page
      clientId: ""
      # Client secret of Notion OAuth application
      clientSecret: ""
      # Secret token for Notion internal integration
      internalSecret: ""
  marketplace:
    # Whether to enable marketplace functionality, allowing installation of application templates
    enabled: true
    # Marketplace frontend access URL
    url: "https://marketplace.dify.ai"
    # Marketplace API interface URL
    apiUrl: "https://marketplace.dify.ai"
  log:
    # Log output format, can be text or json
    outputFormat: "json"

ingress:
  # Whether to enable Kubernetes Ingress for external network access
  enabled: false
  # Use IP address as hostname for accessing services via IP address
  # ! Only supported for non-enterprise edition !
  useIpAsHost: false
  # Ingress controller class name, such as nginx, traefik, alb, etc., depends on the controller type installed in the cluster
  className: ""
  annotations:
    {}
    # kubernetes.io/tls-acme: "true"
    # HTTPS protocol configuration is set here, specific configuration depends on the Ingress controller being used
  # TLS certificate configuration list, HTTPS certificate configuration
  tls: []

api:
   # Whether to enable API service, this is Dify's core backend service
  enabled: true
  image:
    # Image repository address, g-hsod9681 prefix is for domestic accelerated image address
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-api
    repository: langgenius/dify-api
    # Override appVersion in Chart.yaml, if not empty
    tag: "459f017de586871e9478d6198f323391d4ba378c"
  # Number of API service replicas, recommended 2+ for high availability in production environment
  replicas: 1
  # CPU and memory resource limit configuration, adjust according to actual load
  resources: 
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  # Kubernetes service account name, used for authorization when API service accesses external resources
  serviceAccountName: ""
  # Node selector, used to schedule Pods to nodes with specific labels
  nodeSelector: {}
  # Pod affinity configuration, controls Pod scheduling strategy
  affinity: {}
  # Taint tolerance configuration, allows Pods to be scheduled on nodes with taints
  tolerations: []
  readinessProbe:
    # Number of consecutive failures before considering service unavailable
    failureThreshold: 3
    httpGet:
      # HTTP path for health check
      path: /health
      # Port number for health check
      port: 5001
      # Protocol used HTTP/HTTPS
      scheme: HTTP
    # Seconds to wait after container startup before beginning health checks
    initialDelaySeconds: 30
    # How often (in seconds) to perform health checks
    periodSeconds: 10
    # Number of consecutive successes before considering service available
    successThreshold: 1
    # Timeout for single health check
    timeoutSeconds: 3
  livenessProbe:
    # Number of consecutive failures before restarting container
    failureThreshold: 3
    httpGet:
      path: /health
      port: 5001
      scheme: HTTP
    # How long to wait after container startup before beginning liveness checks
    initialDelaySeconds: 60
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
  extraEnv:
  # Apply your own Environment Variables if necessary. Below is demo.
  # extraEnv:
  #   - name: ENV_FROM_COMMUNITY1
  #     value: env123
  #   - name: ENV_FROM_COMMUNITY2
  #     value: env123
  # Deployment environment identifier, PRODUCTION=production environment, DEVELOPMENT=development environment
  deployEnv: "PRODUCTION"
  # Allowed origins for Web API cross-origin requests, * means allow all origins
  webApiCorsAllowOrigins: "*"
  # Allowed origins for console cross-origin requests
  consoleCorsAllowOrigins: "*"
  # Number of worker processes for API server, recommended to adjust based on CPU core count
  serverWorkerAmount: 1
  # URL address for checking Dify new version updates
  checkUpdateUrl: "https://updates.dify.ai"
  innerApi:
    # Whether to enable internal API for inter-service communication
    enabled: true
    # Internal API access key, must be replaced in production environment
    apiKey: "#REPLACE_ME#"
  oauth:
    # OAuth authentication redirect path
    redirectPath: "/console/api/oauth/authorize"
    github:
      # GitHub OAuth application client ID
      clientId: ""
      # GitHub OAuth application client secret
      clientSecret: ""
    google:
      # Google OAuth application client ID
      clientId: ""
      # Google OAuth application client secret
      clientSecret: ""
  db:
    # Maximum number of database connection pool connections, adjust according to concurrency
    poolSize: 250
    # Connection recycle time in connection pool (seconds), prevents long-idle connections
    poolRecycle: 3600
  limits:
    # upload file size limit in MB
    uploadFileSize: 15
    # upload file batch count limit
    uploadFileBatchCount: 5
    # upload image file size limit in MB
    uploadImageFileSize: 5
  sentry:
    # Whether to enable Sentry error monitoring and performance tracing
    enabled: false
    # Sentry project DSN (Data Source Name)
    dsn: ""
    # Performance tracing sample rate, between 0.0-1.0
    tracesSampleRate: 1.0
    # Performance profiling sample rate, between 0.0-1.0
    profilesSampleRate: 1.0
  positionTool:
    # Fixed display tool position configuration
    pins: ""
    # List of included tools
    includes: ""
    # List of excluded tools
    excludes: ""
  positionProvider:
    # Fixed display model provider position
    pins: ""
    # List of included providers
    includes: ""
    # List of excluded providers
    excludes: ""

worker:
  # Whether to enable Worker service for processing asynchronous tasks
  enabled: true
  image:
    # Image repository address, g-hsod9681 prefix is for domestic accelerated image address
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-api
    repository: langgenius/dify-api
  # Number of Worker service replicas
  replicas: 1
  resources: {}
  serviceAccountName: ""
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Worker service usually does not need HTTP health checks
  readinessProbe: {}
  livenessProbe: {}
  extraEnv:
  # Number of Celery worker processes, recommended to adjust based on CPU core count
  celeryWorkerAmount: 1
  db:
    # Worker database connection pool configuration
    poolSize: 250
    poolRecycle: 3600
  sentry:
    # Worker Sentry monitoring configuration
    enabled: false
    dsn: ""
    tracesSampleRate: 1.0
    profilesSampleRate: 1.0

triggerWorker:
  # Whether to enable trigger Worker service for processing scheduled tasks and trigger-related async tasks
  enabled: true
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-api
    repository: langgenius/dify-api
  # Number of trigger Worker service replicas
  replicas: 1
  resources: {}
  serviceAccountName: ""
  nodeSelector: {}
  affinity: {}
  tolerations: []
  readinessProbe: {}
  livenessProbe: {}
  extraEnv:
  # Number of Celery worker processes
  celeryWorkerAmount: 1
  db:
    # Trigger Worker database connection pool configuration
    poolSize: 250
    poolRecycle: 3600
  sentry:
    enabled: false
    dsn: ""
    tracesSampleRate: 1.0
    profilesSampleRate: 1.0
  code:
    # Sandbox execution-related limits for trigger worker
    maxStringArrayLength: 500
    maxObjectArrayLength: 500
    maxNumberArrayLength: 500

workerBeat:
  # Whether to enable Worker Beat service for scheduling periodic tasks
  enabled: true
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-api
    repository: langgenius/dify-api
  resources: {}
  serviceAccountName: ""
  nodeSelector: {}
  affinity: {}
  tolerations: []
  readinessProbe: {}
  livenessProbe: {}
  extraEnv:
  db:
    poolSize: 30
    poolRecycle: 3600
  # Whether to enable workflow log cleanup
  enableWorkflowLogCleanup: false

web:
  # Whether to enable Web frontend service
  enabled: true
  image:
    # Image repository address, g-hsod9681 prefix is for domestic accelerated image address
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-web
    repository: langgenius/dify-web
  replicas: 1
  resources: {}
  serviceAccountName: ""
  nodeSelector: {}
  affinity: {}
  tolerations: []
  readinessProbe:
    initialDelaySeconds: 3
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      # Default port for Next.js frontend service
      port: 3000
    timeoutSeconds: 1
  livenessProbe:
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 3000
    timeoutSeconds: 1
  extraEnv:
  sentry:
    # Frontend Sentry monitoring configuration
    enabled: false
    dsn: ""
    tracesSampleRate: 1.0
    profilesSampleRate: 1.0

sandbox:
  # Whether to enable code execution sandbox service for securely executing user code
  enabled: true
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-sandbox
    repository: langgenius/dify-sandbox
    tag: "0.2.12"
  replicas: 1
  resources: {}
  serviceAccountName: ""
  nodeSelector: {}
  affinity: {}
  tolerations: []
  readinessProbe:
    # Sandbox starts slowly, allow more failure attempts
    failureThreshold: 60
    initialDelaySeconds: 3
    # Higher check frequency
    periodSeconds: 3
    successThreshold: 1
    tcpSocket:
      # Sandbox service port
      port: 8194
    timeoutSeconds: 3
  livenessProbe:
    failureThreshold: 3
    periodSeconds: 3
    successThreshold: 1
    tcpSocket:
      port: 8194
    timeoutSeconds: 1
  extraEnv:
  # Sandbox API access key, must be replaced in production environment
  apiKey: "#REPLACE_ME#"
  # Code execution timeout (seconds)
  workerTimeout: 15
  # Maximum number of sandbox worker processes
  maxWorkers: 4
  # Maximum number of sandbox requests
  maxRequests: 50
  pythonRequirements: |
    # The requirements.txt file content
    # For example:
    # fastapi==0.104.1
    # pydantic==2.5.1

enterprise:
  # Whether to enable enterprise edition features
  enabled: true
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-enterprise
    repository: langgenius/dify-enterprise
    tag: "0.14.4"
  replicas: 1
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  readinessProbe:
    failureThreshold: 3
    httpGet:
      # Enterprise edition health check path
      path: /v1/healthz
      # Enterprise edition service port
      port: 8082
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /v1/healthz
      port: 8082
      scheme: HTTP
    initialDelaySeconds: 20
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
  extraEnv:
  appSecretKey: "#REPLACE_ME#"
  # Salt value for admin API key, used to generate admin API key
  adminAPIsSecretKeySalt: "#REPLACE_ME#"
  innerApi:
    # Enterprise edition internal API configuration
    enabled: true
    apiKey: "#REPLACE_ME#"
  # CORS allowed origin addresses for enterprise edition frontend
  corsOrigins: "http://localhost:3000,http://localhost:3001,http://localhost:3002"
  # Kubernetes service account dedicated to enterprise edition
  serviceAccountName: "dify-enterprise"
  # License verification mode: online=online verification, offline=offline verification
  licenseMode: "online"
  # License verification server address
  licenseServer: "https://licenses.dify.ai/server"
  # Whether console SSO skips SSL certificate verification (recommended false for production)
  consoleSSOSkipCertVerify: false
  # Whether web SSO skips SSL certificate verification
  webSSOSkipCertVerify: false
  # Whether dashboard SSO skips SSL certificate verification
  dashboardSSOSkipCertVerify: false
  # HTTP server request timeout
  serverTimeout: "60s"
  # gRPC server request timeout
  grpcServerTimeout: "60s"
  # Workspace synchronization cron expression
  workspaceSyncCron: "*/5 * * * *"
  # Workspace synchronization timeout
  workspaceSyncTimeout: "30s"
  # Base64 encoded 32-byte AES-256 key for encrypting password policy. Generate using `openssl rand -base64 32`
  passwordEncryptionKey: "xHBzZKP288fiIUdCkYJW5Px/16kCqkJucXue6x/97eo="
  # Plugin manager client timeout
  pluginManagerClientTimeout: "60s"

enterpriseAudit:
  # Whether to enable enterprise edition audit functionality, recording user operations and system events
  enabled: true
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-audit
    repository: langgenius/dify-audit
  replicas: 1
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /v1/healthz
      # Audit service port
      port: 8083
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /v1/healthz
      port: 8083
      scheme: HTTP
    initialDelaySeconds: 20
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
  extraEnv:
  scheduler:
    # Audit log solidification scheduled task Cron expression: minute hour day month weekday
    solidifyCheckCron: "0 0 */1 * *" # minutes hours day-of-month month day-of-week
    # Audit log solidification delay days, solidify to long-term storage after 90 days
    solidifyDelayDays: 90
    # Scheduler task timeout
    timeout: "600s"
  mq:
    # Message queue check interval
    checkInterval: "5s"
    # Synchronization threshold, triggers batch processing when this count is reached
    syncThreshold: 200
    # Maximum wait time for message queue
    maxWait: "10s"
  # Audit service HTTP timeout
  serverTimeout: "60s"
  # Audit service gRPC timeout
  grpcServerTimeout: "60s"
  # Audit log download timeout
  downloadTimeout: "60s"

enterpriseFrontend:
  # Whether to enable enterprise edition frontend, providing enterprise edition dedicated management interface
  enabled: true
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-enterprise-frontend
    repository: langgenius/dify-enterprise-frontend
    tag: "0.14.4"
  replicas: 1
  resources: {}
  serviceAccountName: ""
  nodeSelector: {}
  affinity: {}
  tolerations: []
  readinessProbe:
    initialDelaySeconds: 3
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 3000
    timeoutSeconds: 1
  livenessProbe:
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 3000
    timeoutSeconds: 1
  extraEnv:
  # Apply your own Environment Variables if necessary. Below is demo.
  # extraEnv:
  #   - name: ENV_FROM_COMMUNITY1
  #     value: env123
  #   - name: ENV_FROM_COMMUNITY2
  #     value: env123

ssrfProxy:
  # Whether to enable SSRF protection proxy
  enabled: true
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/squid
    repository: ubuntu/squid
    tag: "6.13-25.04_beta"
  replicas: 1
  resources: {}
  serviceAccountName: ""
  nodeSelector: {}
  affinity: {}
  tolerations: []
  readinessProbe: {}
  livenessProbe: {}
  # Custom sandbox host for squid reverse proxy. Leave empty to use default (recommended)
  sandboxHost: ""
  extraEnv:

unstructured:
  # Whether to enable Unstructured document processing service, supporting complex document format parsing
  enabled: true
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/unstructured-api
    repository: downloads.unstructured.io/unstructured-io/unstructured-api
    tag: "0.0.70"
  replicas: 1
  resources: {}
  serviceAccountName: ""
  nodeSelector: {}
  affinity: {}
  tolerations: []
  readinessProbe: {}
  livenessProbe: {}
  # unstructured_api_key:{ }
  # Use the api key only if you are trying to access .ppt document analyze service provided by unstructured.io
  extraEnv:

plugin_daemon:
  # Whether to enable plugin daemon, supporting third-party plugins and tool extensions
  enabled: true
  replicas: 1
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-plugin-daemon
    repository: langgenius/dify-plugin-daemon
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Plugin system API access key
  apiKey: "#REPLACE_ME#"
  # Maximum plugin startup time (seconds)
  maxLaunchSeconds: 3600
  # Whether to force verify plugin digital signatures, true=only allow verified plugins
  forceVerifyingSignature: false
  # NodePort / LoadBalancer
  serviceType: "NodePort"
  # loadbalancer or node ip
  remoteInstallHost: "127.0.0.1"
  # Remote installation service port
  remoteInstallPort: "5003"
  # Plugin execution timeout (seconds)
  pluginExecuteTimeout: "360"
  # Whether to enable admin API
  adminApiEnabled: true

plugin_controller:
  # Plugin controller replica count
  replicas: 1
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/enterprise_plugin-crd
    repository: langgenius/enterprise_plugin-crd
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

plugin_connector:
  # Plugin connector replica count
  replicas: 1
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/enterprise_plugin-connector
    repository: langgenius/enterprise_plugin-connector
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Additional label configuration
  labels: {}
  # Plugin connector API key
  apiKey: "#REPLACE_ME#"
  # Maximum wait time for plugin operations (seconds)
  maxWaitSeconds: 3600
  # Custom service account name
  customServiceAccount: ""
  # Service account used by plugin runners
  runnerServiceAccount: ""
  # Image repository access secret name
  imageRepoSecret: "image-repo-secret"
  # Image repository prefix address
  imageRepoPrefix: "docker.io/your-image-repo-prefix"
  # imageRepoType: docker / ecr
  imageRepoType: docker
  # AWS ECR region configuration (when using ECR)
  ecrRegion: "us-east-1"
  # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/nginx:1.29.4-alpine
  gatewayImage: "nginx:1.29.4-alpine"
  # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/executor:latest
  shaderImage: "gcr.io/kaniko-project/executor:latest"
  # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/busybox:latest
  busyBoxImage: "busybox:latest"
  # AWS CLI image for ECR operations
  awsCliImage: "amazon/aws-cli:latest"
  # Builder name, kaniko is the default container image builder
  builderName: "kaniko"
  # Plugin resource limits configuration
  pluginResourceLimits:
    cpu: 1000m
    memory: 3000Mi
    ephemeralStorage: 5Gi
  # Plugin resource requests configuration
  pluginResourceRequests:
    cpu: 100m
    memory: 50Mi
    ephemeralStorage: 5Gi
  # Enable secure mode for plugin connector
  secure: false
  # GitHub builder configuration
  github:
    authMethod: "auto"
    accessToken: ""
    repoName: "your-repo-name"
    actionFileName: "build.yml"
    branch: "main"
    imagePrefix: "docker.io/your-image-repo-prefix"
    orgName: "your-org-name"
    shaderImage: "gcr.io/kaniko-project/executor:latest"
    app:
      enabled: false
      appId: "0"
      installationId: "0"
      privateKeySecretKey: "app.pem"
  # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/plugin-build-base-python:3.14
  # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/plugin-build-base-python:3.13
  # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/plugin-build-base-python:3.12
  # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/plugin-build-base-python:3.11
  # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/plugin-build-base-python:3.10
  # Plugin generator configuration, defining build images for different Python versions
  generatorConf: |
    generator:
      repo: langgenius
      python:
        pipMirror: ""
        preCompile: true
        versions:
          python3.14:
            langgenius: docker.io/langgenius/plugin-build-base-python:3.14-secure
          python3.13:
            langgenius: docker.io/langgenius/plugin-build-base-python:3.13-secure
          python3.12:
            langgenius: docker.io/langgenius/plugin-build-base-python:3.12-secure
          python3.11:
            langgenius: docker.io/langgenius/plugin-build-base-python:3.11
          python3.10:
            langgenius: docker.io/langgenius/plugin-build-base-python:3.10

gateway:
  # Enterprise edition gateway service replica count
  replicas: 1
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/enterprise_gateway
    repository: langgenius/enterprise_gateway
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Caddy reverse proxy transport timeouts
  transport:
    dialTimeout: "30s"
    keepalive: "30s"
    keepaliveInterval: "30s"
  # Additional origins to allow CORS requests from, leave empty for only dify domains
  allowOrigins:
    - http://localhost:3000
    - http://localhost:3001
    - http://localhost:5001
    - http://localhost:3002
  log:
    filterFields:
      - request>headers>X-Csrf-Token delete

plugin_manager:
  # Whether to enable plugin manager service
  enabled: true
  replicas: 1
  image:
    # g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-plugin-manager
    repository: langgenius/dify-plugin-manager
    tag: "0.14.4"
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Server timeout
  serverTimeout: "60s"
  # gRPC server timeout
  grpcServerTimeout: "60s"
  # Plugin resource monitoring metric source
  # disabled: no metrics collected
  # cadvisor: collect from cadvisor
  # prometheus: query from prometheus (recommended)
  metric:
    source: "disabled"
    scrape:
      retainPeriod: 604800s
      tsdbBlockSizeLimitBytes: 536870912
      scrapeTimeout: 10s
      scrapeInterval: 20s
      tmpDir: /tmp

minio:
  # MinIO Root username
  rootUser: minioadmin
  # MinIO server root password. Generate a strong password using `openssl rand -base64 32`
  rootPassword: NzGG+ngHuwz0xzMQ1XFt8JYCAxdrhnQ8/93LCggMt00=
  # MinIO replica count
  replicas: 1
  # MinIO running mode: standalone=single node, distributed=distributed
  mode: standalone
  resources:
    limits:
      # CPU resource limit
      cpu: 1000m
      # Memory resource limit
      memory: 2048Mi
    requests:
      # CPU resource request
      cpu: 500m
      # Memory resource request
      memory: 1024Mi
  persistence:
    # Whether to enable MinIO data persistence
    enabled: false

###################################
# Persistence Configration
###################################
persistence:
  # The storage type support: local, s3, azure-blob, aliyun-oss, google-storage, tencent-cos volcengine-tos huawei-obs
  type: "local"
  local:
    # Local storage mount path inside container
    mountPath: "/app/api/storage"
    annotations:
      # Helm resource retention policy, retain data when deleting
      helm.sh/resource-policy: keep
    persistentVolumeClaim:
      # Existing PVC name, leave empty to create new one
      existingClaim: ""
      # Host storage path
      hostPath: "/data/dify"
      ## Dify App Data Persistent Volume Storage Class
      ## If defined, storageClassName: <storageClass>
      ## If set to "-", storageClassName: "", which disables dynamic provisioning
      ## If undefined (the default) or set to null, no storageClassName spec is
      ##   set, choosing the default provisioner.
      ## ReadWriteMany access mode required for `api` and `worker`
      ##
      # Storage class name
      storageClass:
      # Access mode, API and Worker require ReadWriteMany
      accessModes: ReadWriteMany
      # Storage size
      size: 5Gi
      # Sub path
      subPath: ""
  s3:
    # S3-compatible storage endpoint, example for Cloudflare R2
    endpoint: "https://xxx.r2.cloudflarestorage.com"
    # S3 access key ID
    accessKey: "#REPLACE_ME#"
    # S3 secret access key
    secretKey: "#REPLACE_ME#"
    # S3 region
    region: "us-east-1"
    # S3 bucket name
    bucketName: "your-bucket-name"
    # Address type, path or virtual-hosted
    addressType: ""
    # Whether to use AWS managed IAM
    useAwsManagedIam: false
    # Whether to use AWS S3 (instead of other S3-compatible services)
    useAwsS3: true
  azureBlob:
    # Azure storage account name
    accountName: ""
    # Azure storage account key
    accountKey: ""
    # Azure Blob container name
    containerName: ""
    # Azure storage account URL
    accountUrl: ""
  aliyunOss:
    # Alibaba Cloud OSS endpoint
    endpoint: "your-endpoint"
    # OSS bucket name
    bucketName: "your-bucket-name"
    # Alibaba Cloud access key ID
    accessKey: "#REPLACE_ME#"
    # Alibaba Cloud access key secret
    secretKey: "#REPLACE_ME#"
    # OSS region
    region: "ap-southeast-1"
  googleStorage:
    # Google Cloud Storage bucket name
    bucketName: "your-bucket-name"
    # The service account JSON key file content, base64 encoded
    serviceAccountJson: ""
  tencentCos:
    # Tencent Cloud COS bucket name
    bucketName: "your-bucket-name"
    # COS region
    region: ""
    # Tencent Cloud SecretId
    secretId: "#REPLACE_ME"
    # Tencent Cloud SecretKey
    secretKey: "#REPLACE_ME"
    # Access protocol: http or https
    scheme: "https"
  huaweiObs:
    # Huawei Cloud OBS server address
    server: "your-server-url"
    # OBS bucket name
    bucketName: "your-bucket-name"
    # Huawei Cloud access key ID
    accessKey: "#REPLACE_ME#"
    # Huawei Cloud secret access key
    secretKey: "#REPLACE_ME#"
  volcengineTos:
    # Volcengine TOS bucket name
    bucketName: "your-bucket-name"
    # Volcengine access key ID
    accessKey: "#REPLACE_ME#"
    # Volcengine secret access key
    secretKey: "#REPLACE_ME#"
    # TOS endpoint address
    endpoint: "tos-endpoint"
    # TOS region
    region: "your-region"

###################################
# Mail Configuration
###################################
mail:
  # Mail configuration type, supports: resend, smtp
  type: ""
  # Default sender email address (used when no specific address is specified)
  defaultSender: "YOUR EMAIL FROM (eg: no-reply <no-reply@dify.ai>)"
  # Resend service configuration (https://resend.com)
  resend:
    # Resend mail service API key
    apiKey: ""
    # Resend API address
    apiUrl: https://api.resend.com
  smtp:
    # SMTP server address
    server: ""
    # SMTP server port
    port: 587
    # SMTP username
    username: ""
    # SMTP password
    password: ""
    # Whether to use TLS encryption
    useTLS: false

###################################
# External postgres
###################################
externalPostgres:
  # Whether to use external PostgreSQL database
  enabled: false
  # PostgreSQL server address
  address: localhost
  # PostgreSQL port
  port: 5432
  credentials:
    dify:
      # Dify main database name
      database: "dify"
      # Database username
      username: "postgres"
      # Database password
      password: "#REPLACE_ME#"
      # SSL mode: require, prefer, disable, etc.
      sslmode: "require"
      # extras: "options=-c search_path=your-schema -c your-other-option=xxx"
      extras: ""
      # Character set
      charset: ""
      # URI scheme
      uriScheme: "postgresql"
    plugin_daemon:
      # Plugin daemon database name
      database: "dify_plugin_daemon"
      username: "postgres"
      password: "#REPLACE_ME#"
      sslmode: "require"
      # extras: "options=-c search_path=your-schema -c your-other-option=xxx"
      extras: ""
      charset: ""
      uriScheme: "postgresql"
    enterprise:
      # Enterprise edition database name
      database: "enterprise"
      username: "postgres"
      password: "#REPLACE_ME#"
      sslmode: "require"
      # extras: "options=-c search_path=your-schema -c your-other-option=xxx"
      extras: ""
      charset: ""
      uriScheme: "postgresql"
    audit:
      # Audit database name
      database: "audit"
      username: "postgres"
      password: "#REPLACE_ME#"
      sslmode: "require"
      # extras: "options=-c search_path=your-schema -c your-other-option=xxx"
      extras: ""
      charset: ""
      uriScheme: "postgresql"

postgresql:
  # Whether to enable built-in PostgreSQL
  enabled: false
  # PostgreSQL instance name
  name: postgres
  global:
    # Storage class configuration
    storageClass: ""
    postgresql:
      auth:
        # PostgreSQL superuser password
        postgresPassword: "#REPLACE_ME#"
        # Default database name
        database: "dify"
  #        username: ""
  #        password: ""
  primary:
    initdb:
      # Database initialization scripts
      scripts:
        my_init_script.sh: |
          #!/bin/bash
          set -e
          echo "Creating database..."
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U postgres << 'EOF'
          SELECT 'CREATE DATABASE enterprise' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'enterprise')\gexec
          SELECT 'CREATE DATABASE audit' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'audit')\gexec
          EOF

###################################
# External Redis
###################################
externalRedis:
  # Whether to use external Redis
  enabled: true
  # Whether to use SSL connection to Redis
  useSSL: false

  # Redis server address
  host: "redis.example"
  # Redis port
  port: 6379
  # Redis username (Redis 6.0+)
  username: ""
  # Redis password
  password: "#REPLACE_ME#"
  # Redis database number
  db: 0

  sentinel:
    # Whether to enable Redis Sentinel mode
    enabled: false
    # Redis Sentinel node list (comma separated, format: host:port)
    nodes: ""
    # Service name monitored in Redis Sentinel
    serviceName: ""
    # Sentinel username
    username: ""
    # Sentinel password
    password: "#REPLACE_ME#"
    # Redis Sentinel connection socket timeout (unit: seconds)
    socketTimeout: 0.1

  cluster:
    # Whether to enable Redis cluster mode
    enabled: false
    # Redis cluster node list (comma separated, format: host:port)
    nodes: "#REPLACE_ME#"
    # Redis cluster password
    password: "#REPLACE_ME#"

redis:
  # Whether to enable built-in Redis
  enabled: false
  global:
    redis:
      # Built-in Redis password
      password: "#REPLACE_ME#"

###################################
# vectorDB
###################################
vectorDB:
  # Whether to use external vector database
  useExternal: true
  # Vector database type, supported list: https://enterprise-docs.dify.ai/versions/3-0-x/zh-cn/deployment/advanced-configuration/vector-database
  externalWeaviate:
    # Weaviate service endpoint
    endpoint: "http://weaviate:8080"
    # Weaviate API key
    apiKey: "#REPLACE_ME#"
  # External Qdrant
  externalQdrant:
    # Qdrant service endpoint
    endpoint: "http://your-qdrant-cluster-url.qdrant.tech/"
    # Qdrant API key
    apiKey: "#REPLACE_ME#"
  # External Milvus
  externalMilvus:
    # URI for connecting to the Milvus server (e.g., 'http://localhost:19530' or 'https://milvus-instance.example.com:19530')
    uri: "http://127.0.0.1:19530"
    # Milvus access token
    token: ""
    # Milvus username
    user: ""
    # Milvus password
    password: ""
    # Milvus database name
    database: "default"
  externalRelyt:
    # Relyt database host address
    host: "your-relyt.domain"
    # Relyt port
    port: 5431
    # Username
    user: "postgres"
    # Password
    password: "#REPLACE_ME#"
    # Database name
    database: "pgvectors"
  externalPgVectoRS:
    # PgVecto-RS database host
    host: "your-pgvectors.domain"
    # Port
    port: 5432
    # Username
    user: "postgres"
    # Password
    password: "#REPLACE_ME#"
    # Database name
    database: "pgvectors"
  externalTencentVectorDB:
    # Tencent vector database host
    host: "your-tencent-vector-db.domain"
    # API key
    apiKey: "#REPLACE_ME#"
    # Connection timeout
    timeout: 30
    # Username
    username: "tencent"
    # Password
    password: "#REPLACE_ME#"
    # Shard count
    shard: 1
    # Replica count
    replicas: 2
    # Database name
    database: "tencent"
  externalOpenSearch:
    # OpenSearch host address
    host: "your-opensearch.domain"
    # OpenSearch port
    port: 9200
    # Username
    user: ""
    # Password
    password: "#REPLACE_ME#"
    # Whether to use TLS
    useTLS: false
  externalElasticsearch:
    # Elasticsearch host address
    host: "127.0.0.1"
    # Elasticsearch port
    port: 9200
    # Username
    username: "elastic"
    # Password
    password: "#REPLACE_ME#"
  externalAnalyticDB:
    # Alibaba Cloud AnalyticDB key ID
    keyID: "#REPLACE_ME#"
    # Key secret
    keySecret: "#REPLACE_ME#"
    # Region ID
    regionID: "#REPLACE_ME#"
    # Instance ID
    instanceID: "#REPLACE_ME#"
    # Account name
    account: "#REPLACE_ME#"
    # Password
    password: "#REPLACE_ME#"
    # Host address
    host: "#REPLACE_ME#"
    # Port
    port: 5432
    # Namespace
    namespace: ""
    # Namespace password
    namespacePassword: ""
    # Minimum connections
    minConnection: 1
    # Maximum connections
    maxConnection: 5
  externalLindorm:
    # Lindorm service URL
    url: "http://localhost:30070"
    username: "admin"
    password: "admin"
    indexType: "hnsw"
    distanceType: "l2"
    usingUgc: true
    queryTimeout: 2.0

qdrant:
  # Whether to enable built-in Qdrant vector database
  enabled: false
  # Qdrant replica count
  replicaCount: 3
  image:
    repository: langgenius/qdrant
    pullPolicy: IfNotPresent
    tag: "v1.7.3"
  # Qdrant API key
  apiKey: "dify123456"
  persistence:
    # Storage access modes
    accessModes: ["ReadWriteOnce"]
    # Storage size
    size: 10Gi
  resources:
    {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

weaviate:
  # Whether to enable built-in Weaviate vector database
  enabled: false

###################################
# External Prometheus
###################################
externalPrometheus:
  # Provide a Prometheus for plugin metrics monitoring
  enabled: false
  endpoint: "http://prometheus:9090"
  timeout: 10s
  username: ""
  password: ""
  insecure: true

# Docker image pull secrets list
imagePullSecrets: []